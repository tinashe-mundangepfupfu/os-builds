# Kernel boot parameters for Oponn
# Apply these to GRUB and Syslinux configurations

# Security/Performance
mitigations=off

# Preemption model (full for low latency)
preempt=full

# RCU callback offloading (reduce jitter on specific CPUs)
rcu_nocbs=0-7

# CPU frequency governor (set in post-install)
# performance for desktop, schedutil for laptop

# I/O scheduler (set in post-install for SSD)
# mq-deadline for SSD, bfq for HDD

# Additional performance tweaks
transparent_hugepage=never
rcu_nocbs_poll=yes
