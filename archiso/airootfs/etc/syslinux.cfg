UI menu.c32
PROMPT 0
TIMEOUT 50

MENU TITLE Oponn Boot Menu
MENU BACKGROUND splash.png

LABEL arch
    MENU LABEL ^Boot Oponn
    LINUX /boot/vmlinuz-linux-cachyos
    APPEND root=LABEL=PERSONAL_OS rw quiet splash mitigations=off preempt=full rcu_nocbs=0-7
    INITRD /boot/initramfs-linux-cachyos.img

LABEL arch-fallback
    MENU LABEL ^Boot Oponn (Fallback)
    LINUX /boot/vmlinuz-linux-cachyos
    APPEND root=LABEL=PERSONAL_OS rw quiet splash mitigations=off preempt=full rcu_nocbs=0-7
    INITRD /boot/initramfs-linux-cachyos-fallback.img

LABEL local
    MENU LABEL ^Boot from local drive
    LOCALBOOT 0
