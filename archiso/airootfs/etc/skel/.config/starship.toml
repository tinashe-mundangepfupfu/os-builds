format = """
[┌───────────────────>](bold green)
[│](bold green)$directory$git_branch$git_status
[└─>](bold green) """
right_format = """$python$nodejs$rust$golang$cmd_duration$line_break$jobs$status$os$time"""

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
format = "[@](bold blue)[$hostname](bold blue) "

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"
format = "[$path]($style) "

[git_branch]
symbol = " "
format = "on [$symbol$branch](bold purple) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style))'

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol$version]($style) "

[python]
symbol = " "
style = "bold yellow"
format = "via [$symbol$version]($style) "

[rust]
symbol = " "
style = "bold red"
format = "via [$symbol$version]($style) "

[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol$version]($style) "

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "

[time]
disabled = false
style = "bold white"
format = '[$time]($style) '
